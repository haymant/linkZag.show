id: overlay-chart
duration: 10
width: 1600
height: 900
variant: item
background: transparent
padding: 48

items:
  - type: echarts
    file: ../assets/charts/bar.json
    enter:
      type: fade-up
      delay: 0.2
      duration: 0.9
    chartAnimation:
      mode: values
      delay: 0.55
      duration: 1.2
      easing: ease-out
